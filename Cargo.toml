[package]
name = "arpp"
version = "0.1.0"
edition = "2021"
authors = ["Joaquin Bejar <jb@taunais.com>"]
description = "This crate provides a client for the IG Markets API"
license = "MIT"
readme = "README.md"
repository = "https://github.com/joaquinbejar/ARPP"
homepage = "https://github.com/joaquinbejar/ARPP"
keywords = ["finance", "ohlc", "tick", "trading"]
categories = ["finance", "data-structures"]
exclude = [
    "/examples",
    "/tests",
    "/target",
    "/.git",
    "/.github",
    "/.idea",
    "/.vscode",
    "Cargo.lock",
    "/**/.DS_Store",
]
include = [
    "src/**/*",
    "Cargo.toml",
    "README.md",
    "LICENSE",
    "examples/**/*",
    "tests/**/*",
    "Makefile",
    "rust-toolchain.toml",
    "Draws/**/*",
    "Docker/**/*",
]

[dependencies]
tokio-tungstenite = "0.30"
tokio = { version = "1.53", features = ["rt", "rt-multi-thread", "macros", "time", "signal"] }
chrono = { version = "0.4", features = ["serde"] }
approx = "0.5"
uuid = { version = "1.26", features = ["serde","v4"] }
tracing = "0.1"
tracing-subscriber = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
rust_decimal = { version = "1.43", features = ["maths"] }
rust_decimal_macros = "1.40"
libm = "0.2"
futures = "0.3"
num_cpus = "1.17"
rand = "0.10"
async-trait = "0.1"
criterion = "0.8"
clap = { version = "4.6", features = ["derive"] }
plotters = "0.3"
rand_distr = "0.6"
tempfile = "3.27"


[dev-dependencies]
assert-json-diff = "2.0"
pretty_assertions = "1.4"
mockito = "1.7"
tokio = { version = "1", features = ["full", "test-util"] }
serde_json = "1.0"
once_cell = "1.21"
assert_approx_eq = "1.1"

[[test]]
name = "tests"
path = "tests/unit/mod.rs"

[lib]
name = "arpp"
path = "src/lib.rs"

[[bench]]
name = "benchmarks"
harness = false
path = "benches/benchmarks.rs"
